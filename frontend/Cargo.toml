[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
common = { path = "../common" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
