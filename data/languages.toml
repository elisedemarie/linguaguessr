# LinguaGuessr — Language Scoring Metadata
#
# This file is the single source of truth for how languages are grouped
# for scoring purposes. It is intentionally written in plain language so
# that linguists and language enthusiasts can read, verify, and suggest
# changes without needing to understand the game's code.
#
# To suggest a change: open a GitHub issue or leave a comment referencing
# this file. A developer will review and apply it.
#
# Fields per language:
#   script        — the specific writing system used
#   script_family — the broad script lineage for cross-script partial scoring
#                   (e.g. "Brahmic", "Semitic", "CJK", "Latin", "Cyrillic")
#                   scripts with no close relatives use their own name
#   script_branch — the sub-group within the script family
#                   (e.g. "North Indic", "South Indic", "Southeast Asian")
#   script_chars  — lowercase characters that appear in this language's text
#                   (used to compute visual similarity via Jaccard overlap)
#                   omit for logographic or single-language scripts
#   family        — the top-level language family
#   branch        — the sub-group within the family
#   sub_branch    — the closest grouping (siblings score highest partial credit)
#   notes         — optional explanation for non-obvious decisions

# ---------------------------------------------------------------------------
# Scoring rules
#   script_max — maximum script axis score (same chars = this value)
#   family_max — maximum family axis score (same sub-branch = this value)
# Same-script pairs: Jaccard similarity on script_chars × script_max
# Different-script pairs: Jaccard similarity on [script_family, script_branch, script] × script_max
# ---------------------------------------------------------------------------

[scoring]
script_max = 500   # Maximum when scripts are character-for-character identical
family_max = 450   # Maximum when languages share the same sub-branch
unrelated  = 0     # Score when no script or family connection exists


# ---------------------------------------------------------------------------
# Script hierarchy — used for cross-script partial scoring
#
# When a guess uses a different script from the answer, the score is computed
# as Jaccard([script_family, script_branch, script]) × script_max.
#
# To suggest a change to a grouping, open a GitHub issue referencing this block.
#
# Defined families:
#
#   Brahmic         Scripts descended from the ancient Brahmi alphabet
#     North Indic   Devanagari · Gurmukhi · Bengali · Gujarati · Odia · Sinhala
#     South Indic   Tamil · Telugu · Kannada · Malayalam
#     SE Asian      Thai · Khmer · Myanmar
#
#   Semitic         Consonantal scripts from the Semitic writing tradition
#     Arabic        Arabic · Persian · Urdu  (already share script= field)
#     Hebrew        Hebrew
#     Ethiopic      Amharic (Ge'ez-derived)
#
#   CJK             Logographic East Asian scripts
#     Sinitic       Chinese
#     Japanese      Japanese
#
#   Latin           All Latin-alphabet languages  (already share script= field)
#   Cyrillic        All Cyrillic-alphabet languages  (already share script= field)
#
#   Scripts with no close relatives use their own name as both family and branch:
#   Greek · Georgian · Armenian · Korean
# ---------------------------------------------------------------------------

